; PlatformIO Project Configuration File
;
; ESP32 Audio Player via MQTT
; Alternativa ao Arduino IDE
;
; Uso:
;   1. Instale VS Code + extensão PlatformIO
;   2. Abra esta pasta como projeto
;   3. Edite config.h com suas credenciais
;   4. Clique em Upload (seta →)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Velocidade do monitor serial
monitor_speed = 115200

; Bibliotecas necessárias
lib_deps = 
    knolleary/PubSubClient@^2.8

; Configurações de build
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM=0

; Configurações de upload
upload_speed = 921600

; Partições (padrão)
board_build.partitions = default.csv
